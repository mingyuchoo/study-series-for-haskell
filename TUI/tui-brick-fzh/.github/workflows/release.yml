name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_REPOSITORY: ${{ github.repository }}
      run: gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --title "Release $RELEASE_TAG" --notes "" --verify-tag

  build-binaries:
    name: Build Binary for ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: fzh-exe
            asset_name: fzh-linux-x86_64
          - os: macos-latest
            artifact_name: fzh-exe
            asset_name: fzh-macos-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Setup Haskell Stack
      uses: haskell-actions/setup@v2.12.1
      with:
        ghc-version: '9.14.1'
        enable-stack: true
        stack-version: 'latest'

    - name: Cache Stack dependencies
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.stack
          .stack-work
        key: ${{ runner.os }}-stack-release-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
        restore-keys: |
          ${{ runner.os }}-stack-release-

    - name: Build
      run: stack build --copy-bins --local-bin-path ./bin

    - name: Strip binary (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: strip ./bin/${{ matrix.artifact_name }}

    - name: Compress binary
      run: |
        cd ./bin
        tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
        cd ..

    - name: Upload Release Asset
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_ASSET: ./bin/${{ matrix.asset_name }}.tar.gz
      run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --repo "$RELEASE_REPOSITORY"
