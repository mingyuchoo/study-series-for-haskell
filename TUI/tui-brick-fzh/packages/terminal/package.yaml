name: fzh-terminal
version: 0.1.0.0
license: BSD-3-Clause
language: GHC2024
dependencies:
- base ^>= 4.22.0.0
- fzh-domain
- fzh-application
- brick ^>= 3.0
- bytestring ^>= 0.12.2.0
- directory ^>= 1.3.11.0
- filepath ^>= 1.5.5.0
- flow ^>= 2.0.0.11
- text ^>= 2.1.4
- vector ^>= 0.13.2.0
- vty ^>= 6.6
- vty-unix ^>= 0.4.0.0
- unix ^>= 2.8.8.0
- yaml ^>= 0.11.11.2
- skylighting ^>= 0.15
default-extensions:
- OverloadedStrings
ghc-options:
- -Wall
- -O2
library:
  source-dirs: src
tests:
  fzh-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - fzh-terminal
    - hspec ^>= 2.11.18
