name:                fzh
version:             0.1.0.0
github:              mingyuchoo/fzh
license:             BSD-3-Clause
author:              Mingyu Choo
maintainer:          mingyuchoo@gmail.com
copyright:           Mingyu Choo 2025
synopsis:            Haskell로 작성된 퍼지 파인더 TUI 애플리케이션
category:            Tools
description:         Brick 라이브러리 기반의 터미널 퍼지 파인더. fzf와 유사한 기능을 제공하며 Emacs/Vim 키바인딩을 지원합니다.

extra-source-files:
- README.md
- CHANGELOG.md

language: GHC2024

dependencies:
- base ^>= 4.22.0.0
- fzh-application
- fzh-terminal

ghc-options:
- -Wall
- -O2

executables:
  fzh-exe:
    main: Main.hs
    source-dirs: apps/fzh
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
