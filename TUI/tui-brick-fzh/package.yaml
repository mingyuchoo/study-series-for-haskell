name:                fzh
version:             0.1.0.0
github:              mingyuchoo/fzh
license:             BSD-3-Clause
author:              Mingyu Choo
maintainer:          mingyuchoo@gmail.com
copyright:           Mingyu Choo 2025
synopsis:            Haskell로 작성된 퍼지 파인더 TUI 애플리케이션
category:            Tools
description:         Brick 라이브러리 기반의 터미널 퍼지 파인더. fzf와 유사한 기능을 제공하며 Emacs/Vim 키바인딩을 지원합니다.

extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base ^>= 4.22.0.0
- brick ^>= 3.0
- containers ^>= 0.8.1
- directory ^>= 1.3.11.0
- filepath ^>= 1.5.5.0
- flow ^>= 2.0.0.11
- fuzzy ^>= 0.1.1.0
- microlens ^>= 0.5.0.0
- microlens-th ^>= 0.4.3.18
- mtl ^>= 2.3.2
- parallel ^>= 3.3.0.0
- skylighting ^>= 0.15
- skylighting-core ^>= 0.15
- text ^>= 2.1.4
- time ^>= 1.15
- unix ^>= 2.8.8.0
- vector ^>= 0.13.2.0
- vty ^>= 6.6
- vty-unix ^>= 0.4.0.0
- yaml ^>= 0.11.11.2

default-extensions:
- DataKinds
- DeriveGeneric
- ExplicitForAll
- GADTs
- KindSignatures
- StandaloneKindSignatures
- OverloadedStrings
- TemplateHaskell
- TypeApplications

ghc-options:
- -Wall
- -O2
- -haddock

language: GHC2024

library:
  source-dirs: src
  exposed-modules:
    - Lib
    - Config
    - Types
    - Fuzzy
    - Event
    - UI
    - Vty
    - FileSearch
    - SyntaxHighlight

executables:
  fzh-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - fzh

tests:
  fzh-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - fzh
    - hspec ^>= 2.11.18
