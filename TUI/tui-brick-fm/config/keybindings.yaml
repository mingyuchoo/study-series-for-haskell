# hfm은 모든 화면에서 Emacs/Dired 키바인딩을 사용합니다.
# 이전 vim/vi 값도 Emacs로 정규화합니다.
binding_style: emacs

# C-p/n: 이전/다음 항목 또는 보기 한 줄 스크롤
# C-v/M-v: 다음/이전 페이지, M-</>: 처음/끝
# C-x o: 패널 전환, C-x C-f 또는 RET/f: 선택 항목 열기
# C-s/r: 검색 시작 및 검색 결과 다음/이전 이동
# C-x C-c: 모든 화면에서 종료, C-g: 취소, C-x k: 현재 모드 닫기
# Dired 명령: v 보기, C 복사, R 이동/이름 변경, + 폴더 생성
# D: 삭제 확인 (y 실행), ^ 상위 디렉터리, g 새로고침
# M-o: 숨김 파일 전환 (hfm 확장)
# 검색/경로 입력: C-a/e/b/f, M-b/f 커서 이동
# C-h/d: 앞/뒤 문자 삭제, C-k: 커서부터 끝 삭제
# M-Backspace/C-w: 앞 단어 삭제, M-d: 뒤 단어 삭제
# C-a C-k: 전체 입력 삭제
