name: hfm
version: 0.1.0.0
license: BSD-3-Clause
license-file: LICENSE
author: Mingyu Choo
maintainer: mingyuchoo@gmail.com
language: GHC2024
default-extensions:
- OverloadedStrings
ghc-options:
- -Wall
- -O2
when:
- condition: os(darwin)
  ghc-options: -pgml ../../scripts/link-macos.sh
dependencies:
- base >= 4.18 && < 5
- hfm-domain
- hfm-application
- hfm-infrastructure
- hfm-tui
- brick
- vty
- directory
executables:
  hfm-exe:
    main: Main.hs
    source-dirs: app
    ghc-options: -threaded -rtsopts -with-rtsopts=-N
