name:                hfm
version:             0.1.0.0
github:              mingyuchoo/hfm
license:             BSD-3-Clause
author:              Mingyu Choo
maintainer:          mingyuchoo@gmail.com
copyright:           Mingyu Choo 2025
synopsis:            Haskell로 작성된 두 패널 터미널 파일 관리자
category:            Tools
description:         Brick 기반의 두 패널 터미널 파일 관리자. 탐색, 검색, 복사, 이동, 삭제, 디렉터리 생성을 지원합니다.

extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base >= 4.18 && < 5
- brick
- bytestring
- containers
- directory
- filepath
- flow
- fuzzy
- microlens
- microlens-th
- mtl
- parallel
- skylighting >= 0.14
- skylighting-core >= 0.14
- text
- time
- unix
- vector
- vty
- vty-unix
- yaml

default-extensions:
- DataKinds
- DeriveGeneric
- ExplicitForAll
- GADTs
- KindSignatures
- StandaloneKindSignatures
- OverloadedStrings
- TemplateHaskell
- TypeApplications

ghc-options:
- -Wall
- -O2
- -haddock

language: GHC2024

library:
  source-dirs: src
  exposed-modules:
    - Lib
    - Config
    - Types
    - Fuzzy
    - Event
    - UI
    - Vty
    - FileSearch
    - FileManager
    - SyntaxHighlight

executables:
  hfm-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hfm

tests:
  hfm-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hfm
    - hspec
    - doctest
    - doctest-discover
