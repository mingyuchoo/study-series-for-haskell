steps:

  - module_header:
       indent: 2

       sort: false

       separate_lists: true

       break_where: always

       open_bracket: next_line

  - records:
       equals: "same_line"

       first_field: "indent 2"

       field_comment: 2

       deriving: 2

       via: "indent 2"

       sort_deriving: false

       break_enums: false

       break_single_constructors: false

       curried_context: false

  - simple_align:
      cases: always
      top_level_patterns: always
      records: always
      multi_way_if: always

  - imports:
      align: global

      list_align: after_alias

      pad_module_names: false

      long_list_align: multiline

      empty_list_align: inherit

      list_padding: 2

      separate_lists: true

      space_surround: false

      post_qualify: true

      group_imports: false

      group_rules:
        - match: ".*"
          sub_group: "^[^.]+"

  - language_pragmas:
      style: vertical

      align: true

      remove_redundant: true

      language_prefix: LANGUAGE

  - tabs:
       spaces: 4

  - trailing_whitespace: {}

columns: 90

newline: lf

language_extensions:
  - OverloadedStrings
  - DerivingStrategies

cabal: true
