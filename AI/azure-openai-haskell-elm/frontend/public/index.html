<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saniti // Azure OpenAI Studio</title>
    <!-- Google Fonts: IBM Plex Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           DESIGN TOKENS (Saniti Design System / DESIGN.md)
           ========================================================================== */
        :root {
            /* Core Palette Tokens */
            --color-primary: #0b0b0b;
            --color-on-primary: #ffffff;
            --color-brand: #f36458;
            --color-brand-deep: #dd0000;
            --color-ink: #0b0b0b;
            --color-ink-soft: #212121;
            --color-graphite: #353535;
            --color-slate: #3c4758;
            --color-slate-soft: #505b6c;
            --color-mute: #797979;
            --color-ash: #b9b9b9;
            --color-hairline: #ededed;
            --color-hairline-soft: #353535;
            --color-canvas: #0b0b0b;
            --color-canvas-soft: #212121;
            --color-canvas-light: #ffffff;
            --color-canvas-paper: #ededed;
            --color-on-canvas-light: #0b0b0b;
            --color-link-blue: #0052ef;
            --color-link-blue-soft: #55beff;
            --color-surface-blue-bg: #afe3ff;
            --color-success: #37cd84;
            --color-error: #dd0000;

            /* Spacing Tokens */
            --space-xxs: 4px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-xxl: 48px;
            --space-section: 64px;
            --space-section-lg: 96px;

            /* Rounded Tokens */
            --rounded-none: 0px;
            --rounded-app-xs: 3px;
            --rounded-app-sm: 4px;
            --rounded-app-md: 5px;
            --rounded-app-lg: 6px;
            --rounded-marketing: 12px;
            --rounded-full: 99999px;

            /* Fonts */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;

            /* Transition */
            --theme-transition: background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                                border-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                                color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                                box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ==========================================================================
           THEME MAPPINGS: DARK THEME (Brand Voice - Default)
           ========================================================================== */
        :root,
        [data-theme="dark"],
        .theme-dark {
            /* Surfaces & Backgrounds */
            --theme-canvas-bg: #0b0b0b;
            --theme-viewport-bg: #0b0b0b;
            --theme-window-bg: #212121;
            --theme-content-bg: #0b0b0b;
            --theme-chrome-bg: #151515;
            --theme-nav-bg: #0b0b0b;
            --theme-input-container-bg: #131313;
            --theme-input-bg: #0b0b0b;
            --theme-input-disabled: #161616;
            --theme-card-bg: #212121;
            --theme-card-hover-bg: #272727;
            --theme-user-bubble-bg: #1a1a1a;
            --theme-assistant-bubble-bg: #141414;
            --theme-loading-bg: #141414;
            --theme-status-strip-bg: #111111;
            --theme-tab-bg: #212121;
            --theme-tab-active-bg: #353535;
            --theme-pill-bg: #212121;
            --theme-btn-sec-bg: #212121;
            --theme-btn-sec-hover-bg: #2b2b2b;
            --theme-alert-bg: rgba(221, 0, 0, 0.08);

            /* Borders */
            --theme-nav-border: #353535;
            --theme-window-border: #353535;
            --theme-chrome-border: #353535;
            --theme-status-strip-border: #202020;
            --theme-border-input-bar: #353535;
            --theme-input-border: #353535;
            --theme-card-border: #353535;
            --theme-card-hover-border: #505b6c;
            --theme-user-bubble-border: #353535;
            --theme-assistant-bubble-border: #282828;
            --theme-border-loading: #353535;
            --theme-btn-sec-border: #353535;
            --theme-btn-sec-hover-border: #505b6c;
            --theme-pill-border: #353535;

            /* Text & Typography Colors */
            --theme-text-primary: #ffffff;
            --theme-text-secondary: #b9b9b9;
            --theme-text-mute: #797979;
            --theme-text-slate: #505b6c;
            --theme-text-eyebrow: #797979;
            --theme-text-user-bubble: #ffffff;
            --theme-text-assistant-bubble: #ececec;
            --theme-text-tab: #797979;
            --theme-text-tab-active: #ffffff;
            --theme-text-btn-sec: #b9b9b9;
            --theme-text-btn-sec-hover: #ffffff;
            --theme-text-input: #ffffff;
            --theme-input-placeholder: #505b6c;
            --theme-chrome-title: #797979;
            --theme-pill-text: #b9b9b9;
            --theme-alert-text: #b9b9b9;

            /* Shadows & Focus */
            --theme-focus-border: #55beff;
            --theme-focus-ring: rgba(85, 190, 255, 0.25);
            --theme-window-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            --theme-card-hover-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);

            /* Disabled CTA */
            --theme-btn-send-disabled-bg: #272727;
            --theme-btn-send-disabled-text: #555555;

            /* Scrollbars */
            --theme-scrollbar-track: #0b0b0b;
            --theme-scrollbar-thumb: #353535;
            --theme-scrollbar-thumb-hover: #505b6c;
        }

        /* ==========================================================================
           THEME MAPPINGS: LIGHT THEME (Commercial / Inversion Voice)
           ========================================================================== */
        [data-theme="light"],
        .theme-light {
            /* Surfaces & Backgrounds */
            --theme-canvas-bg: #f5f5f7;
            --theme-viewport-bg: #f5f5f7;
            --theme-window-bg: #ffffff;
            --theme-content-bg: #ffffff;
            --theme-chrome-bg: #eeeeF1;
            --theme-nav-bg: #ffffff;
            --theme-input-container-bg: #f8f8fa;
            --theme-input-bg: #ffffff;
            --theme-input-disabled: #f1f1f4;
            --theme-card-bg: #ffffff;
            --theme-card-hover-bg: #fafafc;
            --theme-user-bubble-bg: #0b0b0b;  /* DESIGN.md Polarity Inversion (ink fill) */
            --theme-assistant-bubble-bg: #f9f9fb;
            --theme-loading-bg: #f8f8fa;
            --theme-status-strip-bg: #eeeeF1;
            --theme-tab-bg: #dedee2;
            --theme-tab-active-bg: #0b0b0b;
            --theme-pill-bg: #f0f0f3;
            --theme-btn-sec-bg: #ffffff;
            --theme-btn-sec-hover-bg: #f0f0f3;
            --theme-alert-bg: #fff2f2;

            /* Borders */
            --theme-nav-border: #e2e2e6;
            --theme-window-border: #e2e2e6;
            --theme-chrome-border: #e2e2e6;
            --theme-status-strip-border: #e2e2e6;
            --theme-border-input-bar: #e2e2e6;
            --theme-input-border: #d4d4d8;
            --theme-card-border: #e2e2e6;
            --theme-card-hover-border: #b9b9b9;
            --theme-user-bubble-border: #0b0b0b;
            --theme-assistant-bubble-border: #e4e4e7;
            --theme-border-loading: #d4d4d8;
            --theme-btn-sec-border: #d4d4d8;
            --theme-btn-sec-hover-border: #0b0b0b;
            --theme-pill-border: #e2e2e6;

            /* Text & Typography Colors */
            --theme-text-primary: #0b0b0b;
            --theme-text-secondary: #353535;
            --theme-text-mute: #666666;
            --theme-text-slate: #505b6c;
            --theme-text-eyebrow: #505b6c;
            --theme-text-user-bubble: #ffffff;
            --theme-text-assistant-bubble: #111111;
            --theme-text-tab: #666666;
            --theme-text-tab-active: #ffffff;
            --theme-text-btn-sec: #1a1a1a;
            --theme-text-btn-sec-hover: #0b0b0b;
            --theme-text-input: #0b0b0b;
            --theme-input-placeholder: #8e8e93;
            --theme-chrome-title: #666666;
            --theme-pill-text: #212121;
            --theme-alert-text: #333333;

            /* Shadows & Focus */
            --theme-focus-border: #0052ef;
            --theme-focus-ring: rgba(0, 82, 239, 0.2);
            --theme-window-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
            --theme-card-hover-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);

            /* Disabled CTA */
            --theme-btn-send-disabled-bg: #e5e5e8;
            --theme-btn-send-disabled-text: #999999;

            /* Scrollbars */
            --theme-scrollbar-track: #f8f8fa;
            --theme-scrollbar-thumb: #d4d4d8;
            --theme-scrollbar-thumb-hover: #a1a1aa;
        }

        /* Base Reset */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background-color: var(--theme-canvas-bg);
            color: var(--theme-text-primary);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            transition: var(--theme-transition);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--theme-scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--theme-scrollbar-thumb);
            border-radius: var(--rounded-app-xs);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--theme-scrollbar-thumb-hover);
        }

        /* Typography Helper Classes */
        .display-mega {
            font-family: var(--font-sans);
            font-size: 112px;
            font-weight: 400;
            line-height: 1.0;
            letter-spacing: -4.48px;
            font-feature-settings: 'cv01', 'cv11', 'cv12', 'cv13', 'ss07';
        }

        .display-md {
            font-family: var(--font-sans);
            font-size: 48px;
            font-weight: 400;
            line-height: 1.08;
            letter-spacing: -1.68px;
            font-feature-settings: 'cv01', 'cv11', 'cv12', 'cv13', 'ss07';
        }

        .display-sm {
            font-family: var(--font-sans);
            font-size: 38px;
            font-weight: 400;
            line-height: 1.10;
            letter-spacing: -1.14px;
        }

        .heading-md {
            font-family: var(--font-sans);
            font-size: 32px;
            font-weight: 425;
            line-height: 1.13;
            letter-spacing: -0.32px;
        }

        .heading-sm {
            font-family: var(--font-sans);
            font-size: 20px;
            font-weight: 400;
            line-height: 1.2;
            letter-spacing: -0.24px;
        }

        .subtitle {
            font-family: var(--font-sans);
            font-size: 18px;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: -0.18px;
        }

        .body {
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
        }

        .body-sm {
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: -0.15px;
        }

        .caption {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
        }

        .mono-eyebrow {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .mono-caps {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .mono-micro {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 400;
            line-height: 1.3;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* App Shell */
        #app, .app-shell {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--theme-canvas-bg);
            transition: var(--theme-transition);
        }

        /* ==========================================================================
           NAV BAR (nav-bar, nav-bar-dark)
           ========================================================================== */
        .nav-bar, .nav-bar-dark {
            height: 64px;
            padding: 0 var(--space-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--theme-nav-bg);
            border-bottom: 1px solid var(--theme-nav-border);
            flex-shrink: 0;
            z-index: 50;
            transition: var(--theme-transition);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--color-brand);
            border-radius: var(--rounded-full);
            flex-shrink: 0;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-wordmark {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: var(--theme-text-primary);
            transition: color 0.2s;
        }

        .brand-divider {
            color: var(--theme-text-slate);
            font-weight: 300;
        }

        .brand-sub {
            font-size: 14px;
            color: var(--theme-text-secondary);
            font-weight: 400;
            transition: color 0.2s;
        }

        .badge-version {
            margin-left: 6px;
            padding: 2px 8px;
            background: var(--theme-pill-bg);
            border: 1px solid var(--theme-pill-border);
            border-radius: var(--rounded-app-sm);
            color: var(--theme-text-mute);
            transition: var(--theme-transition);
        }

        .nav-center {
            display: flex;
            align-items: center;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: var(--theme-pill-bg);
            border: 1px solid var(--theme-pill-border);
            border-radius: var(--rounded-full);
            transition: var(--theme-transition);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--color-success);
            box-shadow: 0 0 8px rgba(55, 205, 132, 0.4);
        }

        .status-label {
            color: var(--theme-pill-text);
            font-size: 11px;
            transition: color 0.2s;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Button Secondary (Shared styling for Theme Toggle & New Session) */
        .button-secondary,
        .button-secondary-dark {
            background-color: var(--theme-btn-sec-bg);
            color: var(--theme-text-btn-sec);
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: -0.13px;
            border-radius: var(--rounded-app-md);
            padding: 0 14px;
            height: 36px;
            border: 1px solid var(--theme-btn-sec-border);
            cursor: pointer;
            transition: var(--theme-transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            user-select: none;
        }

        .button-secondary:hover:not(:disabled),
        .button-secondary-dark:hover:not(:disabled) {
            background-color: var(--theme-btn-sec-hover-bg);
            color: var(--theme-text-btn-sec-hover);
            border-color: var(--theme-btn-sec-hover-border);
        }

        .button-secondary.is-disabled,
        .button-secondary:disabled,
        .button-secondary-dark.is-disabled,
        .button-secondary-dark:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Theme Toggle Button Dedicated Styling */
        .button-theme-toggle {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.06em;
            padding: 0 12px;
            border-radius: var(--rounded-app-md);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .button-theme-toggle .theme-icon {
            font-size: 13px;
            line-height: 1;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .button-theme-toggle:hover .theme-icon {
            transform: rotate(20deg) scale(1.18);
        }

        .button-theme-toggle .theme-label {
            font-weight: 500;
        }

        /* ==========================================================================
           STUDIO VIEWPORT & WINDOW (studio-window)
           ========================================================================== */
        .studio-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: var(--space-lg);
            max-width: 1360px;
            width: 100%;
            margin: 0 auto;
            min-height: 0;
            transition: var(--theme-transition);
        }

        .studio-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--theme-window-bg);
            border: 1px solid var(--theme-window-border);
            border-radius: var(--rounded-app-lg);
            overflow: hidden;
            min-height: 0;
            box-shadow: var(--theme-window-shadow);
            transition: var(--theme-transition);
        }

        .studio-chrome-bar {
            height: 38px;
            background: var(--theme-chrome-bg);
            border-bottom: 1px solid var(--theme-chrome-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            transition: var(--theme-transition);
        }

        .studio-traffic-lights {
            display: flex;
            gap: 7px;
        }

        .traffic-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .traffic-red { background: #ff5f56; }
        .traffic-yellow { background: #ffbd2e; }
        .traffic-green { background: #27c93f; }

        .studio-window-title {
            color: var(--theme-chrome-title);
            font-size: 11px;
            user-select: none;
            transition: color 0.2s;
        }

        .studio-toolbar-tabs {
            display: flex;
            gap: 6px;
        }

        /* button-app-tab */
        .button-app-tab {
            background: var(--theme-tab-bg);
            color: var(--theme-text-tab);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: var(--rounded-app-sm);
            padding: 3px 8px;
            user-select: none;
            transition: var(--theme-transition);
        }

        .button-app-tab.active {
            background: var(--theme-tab-active-bg);
            color: var(--theme-text-tab-active);
        }

        .studio-window-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--theme-content-bg);
            min-height: 0;
            overflow: hidden;
            transition: var(--theme-transition);
        }

        /* ==========================================================================
           MESSAGES CONTAINER & HERO
           ========================================================================== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        /* Welcome / Hero State */
        .welcome-hero {
            max-width: 860px;
            margin: var(--space-xl) auto;
            text-align: left;
            animation: fadeIn 0.35s ease-in;
            width: 100%;
        }

        .hero-eyebrow {
            color: var(--theme-text-eyebrow);
            margin-bottom: var(--space-sm);
            transition: color 0.2s;
        }

        .hero-title {
            color: var(--theme-text-primary);
            margin-bottom: var(--space-sm);
            transition: color 0.2s;
        }

        .hero-subtitle {
            color: var(--theme-text-secondary);
            margin-bottom: var(--space-xl);
            max-width: 660px;
            transition: color 0.2s;
        }

        .prompt-cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-md);
        }

        /* feature-card-dark / feature-card-light / prompt-card */
        .feature-card-dark.prompt-card,
        .feature-card-light.prompt-card,
        .prompt-card {
            background: var(--theme-card-bg);
            color: var(--theme-text-primary);
            border: 1px solid var(--theme-card-border);
            border-radius: var(--rounded-marketing);
            padding: var(--space-lg);
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.2s,
                        background-color 0.2s,
                        box-shadow 0.2s;
        }

        .feature-card-dark.prompt-card:hover,
        .feature-card-light.prompt-card:hover,
        .prompt-card:hover {
            background-color: var(--theme-card-hover-bg);
            border-color: var(--theme-card-hover-border);
            box-shadow: var(--theme-card-hover-shadow);
            transform: translateY(-2px);
        }

        .prompt-card-eyebrow {
            color: var(--theme-text-eyebrow);
            margin-bottom: 2px;
            transition: color 0.2s;
        }

        .prompt-card-title {
            color: var(--theme-text-primary);
            font-size: 17px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .prompt-card-desc {
            color: var(--theme-text-secondary);
            font-size: 13px;
            line-height: 1.5;
            flex: 1;
            transition: color 0.2s;
        }

        .prompt-card-action {
            color: var(--color-brand);
            margin-top: var(--space-xs);
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        /* ==========================================================================
           MESSAGE ROWS & BUBBLES
           ========================================================================== */
        .message-row {
            width: 100%;
            display: flex;
            animation: fadeIn 0.25s ease-out;
        }

        .user-row {
            justify-content: flex-end;
        }

        .assistant-row {
            justify-content: flex-start;
        }

        .error-row {
            justify-content: center;
        }

        .message-wrapper {
            max-width: 85%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .user-wrapper {
            align-items: flex-end;
        }

        .assistant-wrapper {
            align-items: flex-start;
            max-width: 88%;
        }

        .message-meta-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message-role-tag {
            color: var(--theme-text-mute);
            transition: color 0.2s;
        }

        .assistant-brand-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--color-brand);
            flex-shrink: 0;
        }

        .assistant-brand-dot.pulse {
            animation: dotPulse 1.2s infinite ease-in-out;
        }

        .message-card {
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--rounded-app-lg);
            line-height: 1.6;
            word-break: break-word;
            font-size: 15px;
            transition: var(--theme-transition);
        }

        .user-card {
            background-color: var(--theme-user-bubble-bg);
            border: 1px solid var(--theme-user-bubble-border);
            color: var(--theme-text-user-bubble);
            border-top-right-radius: var(--rounded-app-xs);
        }

        .assistant-card {
            background-color: var(--theme-assistant-bubble-bg);
            border: 1px solid var(--theme-assistant-bubble-border);
            color: var(--theme-text-assistant-bubble);
            border-top-left-radius: var(--rounded-app-xs);
        }

        .message-content {
            white-space: pre-wrap;
            font-family: inherit;
        }

        /* Loading / Reasoning State */
        .loading-card {
            background: var(--theme-loading-bg);
            border: 1px dashed var(--theme-border-loading);
        }

        .reasoning-state {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
        }

        .reasoning-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-brand);
            animation: dotPulse 1.4s infinite ease-in-out;
        }

        .reasoning-text {
            color: var(--theme-text-secondary);
            font-size: 12px;
            transition: color 0.2s;
        }

        /* Alert Banner (Error) */
        .alert-banner {
            background: var(--theme-alert-bg);
            border: 1px solid var(--color-brand-deep);
            border-radius: var(--rounded-app-lg);
            padding: var(--space-md);
            width: 100%;
            max-width: 860px;
            box-sizing: border-box;
            transition: var(--theme-transition);
        }

        .alert-header {
            color: var(--color-brand);
            margin-bottom: 4px;
        }

        .alert-body {
            color: var(--theme-alert-text);
            font-size: 14px;
        }

        /* ==========================================================================
           INPUT AREA (input-container)
           ========================================================================== */
        .input-container {
            background: var(--theme-input-container-bg);
            border-top: 1px solid var(--theme-border-input-bar);
            padding: var(--space-md) var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            transition: var(--theme-transition);
        }

        .input-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-hint {
            color: var(--theme-text-mute);
            transition: color 0.2s;
        }

        .input-status {
            color: var(--theme-text-slate);
            transition: color 0.2s;
        }

        .input-field-row {
            display: flex;
            gap: var(--space-md);
            align-items: flex-end;
        }

        .studio-textarea {
            flex: 1;
            background: var(--theme-input-bg);
            border: 1px solid var(--theme-input-border);
            border-radius: var(--rounded-app-xs);
            color: var(--theme-text-input);
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            padding: 12px 16px;
            resize: none;
            min-height: 52px;
            max-height: 160px;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s, color 0.2s;
        }

        .studio-textarea::placeholder {
            color: var(--theme-input-placeholder);
        }

        .studio-textarea:focus {
            outline: none;
            border-color: var(--theme-focus-border);
            box-shadow: 0 0 0 1px var(--theme-focus-border), 0 0 0 3px var(--theme-focus-ring);
        }

        .studio-textarea:disabled {
            background: var(--theme-input-disabled);
            color: var(--theme-text-mute);
            cursor: not-allowed;
        }

        /* button-brand (The Signature Coral-Red CTA) */
        .button-brand.send-button {
            background-color: var(--color-brand);
            color: var(--color-ink);
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
            height: 44px;
            padding: 0 var(--space-lg);
            border-radius: var(--rounded-full);
            border: none;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.15s, box-shadow 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .button-brand.send-button:hover:not(:disabled) {
            background-color: #ff766b;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(243, 100, 88, 0.35);
        }

        .button-brand.send-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .button-brand.send-button:disabled {
            background-color: var(--theme-btn-send-disabled-bg);
            color: var(--theme-btn-send-disabled-text);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-content {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid #0b0b0b;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-arrow {
            font-weight: 600;
            transition: transform 0.15s;
        }

        .button-brand.send-button:hover:not(:disabled) .btn-arrow {
            transform: translateX(2px);
        }

        /* ==========================================================================
           STUDIO STATUS STRIP (studio-status-strip)
           ========================================================================== */
        .studio-status-strip {
            height: 30px;
            background: var(--theme-status-strip-bg);
            border-top: 1px solid var(--theme-status-strip-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            transition: var(--theme-transition);
        }

        .status-item {
            color: var(--theme-text-mute);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .status-dot-mini {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--color-success);
        }

        /* ==========================================================================
           ANIMATIONS & RESPONSIVENESS
           ========================================================================== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dotPulse {
            0%, 100% {
                opacity: 0.4;
                transform: scale(0.85);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive Breakpoints (DESIGN.md) */
        @media (max-width: 960px) {
            .prompt-cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .brand-sub, .badge-version {
                display: none;
            }
            .studio-viewport {
                padding: var(--space-md);
            }
        }

        @media (max-width: 768px) {
            .display-md {
                font-size: 34px;
                letter-spacing: -1.0px;
            }
            .prompt-cards-grid {
                grid-template-columns: 1fr;
            }
            .studio-toolbar-tabs {
                display: none;
            }
            .nav-center {
                display: none;
            }
            .messages-container {
                padding: var(--space-md);
            }
        }

        @media (max-width: 480px) {
            .nav-bar, .nav-bar-dark {
                padding: 0 var(--space-md);
            }
            .studio-viewport {
                padding: var(--space-xs);
            }
            .input-meta-bar {
                display: none;
            }
            .studio-status-strip {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="elm.js"></script>
    <script>
        (function() {
            const STORAGE_KEY = 'saniti_theme';

            // Resolve initial theme: localStorage -> prefers-color-scheme -> default to 'dark'
            function resolveInitialTheme() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved === 'light' || saved === 'dark') {
                        return saved;
                    }
                } catch (e) {
                    console.warn('localStorage is not accessible', e);
                }

                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    return 'light';
                }
                return 'dark';
            }

            const initialTheme = resolveInitialTheme();
            document.documentElement.setAttribute('data-theme', initialTheme);

            // Setup MutationObserver to sync theme changes from Elm app-shell to document & localStorage
            function observeThemeChanges() {
                const appContainer = document.getElementById('app');
                if (!appContainer) return;

                const observer = new MutationObserver(function() {
                    const shell = appContainer.querySelector('[data-theme]');
                    if (shell) {
                        const currentTheme = shell.getAttribute('data-theme');
                        if (currentTheme && (currentTheme === 'dark' || currentTheme === 'light')) {
                            const htmlTheme = document.documentElement.getAttribute('data-theme');
                            if (htmlTheme !== currentTheme) {
                                document.documentElement.setAttribute('data-theme', currentTheme);
                                try {
                                    localStorage.setItem(STORAGE_KEY, currentTheme);
                                } catch (e) {}
                            }
                        }
                    }
                });

                observer.observe(appContainer, {
                    attributes: true,
                    subtree: true,
                    attributeFilter: ['data-theme', 'class']
                });
            }

            function initializeApp() {
                if (typeof Elm === 'undefined' || !Elm.Main) {
                    console.error("Elm failed to load.");
                    return;
                }
                const origin = window.location.origin;
                const apiUrl = (origin && origin.startsWith('http')) ? origin : 'http://localhost:8000';
                Elm.Main.init({
                    node: document.getElementById('app'),
                    flags: {
                        apiUrl: apiUrl,
                        theme: initialTheme
                    }
                });

                observeThemeChanges();
            }

            if (typeof Elm !== 'undefined' && Elm.Main) {
                initializeApp();
            } else {
                // Fallback attempt for different path configurations
                const scriptFallback = document.createElement('script');
                scriptFallback.src = '../elm.js';
                scriptFallback.onload = initializeApp;
                scriptFallback.onerror = function() {
                    console.error("Failed to load elm.js from either ./elm.js or ../elm.js");
                };
                document.head.appendChild(scriptFallback);
            }
        })();
    </script>
</body>
</html>
