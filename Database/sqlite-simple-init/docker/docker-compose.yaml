services:
  sqlite-simple-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PROJECT_NAME: sqlite-simple-init
    image: sqlite-simple-init:latest
    container_name: sqlite-simple-init-app
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/app/data
      - ../static:/app/static:ro
    environment:
      - DATABASE_PATH=/app/data/users.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/app/app-exe"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  sqlite-data:
    driver: local
