resolver: lts-24.40

packages:
- .

extra-package-dbs: []
extra-deps:
- hpack-0.38.1
flags: {}

docker:
  enable: false
  image: "fpco/stack-build:lts"
  container-name: "postgresql-persist-init"
  auto-pull: true
  persist: false
  set-user: true
  stack-exe: host
  run-args: []
  env:
    - "LC_ALL=C.UTF-8"
